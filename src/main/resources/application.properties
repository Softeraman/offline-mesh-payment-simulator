# Public portfolio demo: synthetic accounts, temporary data only.
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:meshpay;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.show-sql=false
spring.h2.console.enabled=false
logging.level.com.demo.upimesh=INFO
upi.mesh.idempotency-ttl-seconds=86400
upi.mesh.packet-max-age-seconds=86400
